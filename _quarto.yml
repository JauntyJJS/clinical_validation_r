project:
  type: website
  output-dir: docs
  
execute:
  freeze: false

website:
  page-navigation: true
  # title: "Clinical Data Validation in R"
  description: A guide on how to do clinical data validation using some R packages.
  sidebar:
    logo: "images/image.jpg"
    background: "#F5F5F5"
    style: "docked"
    search: true
    collapse-level: 1
    contents:
      - href: index.qmd
        # text: Welcome
      - section: "Validation Basics"
        contents:
          - getting_started/introduction.qmd
          - getting_started/treatment_control.qmd
          - getting_started/bmi.qmd
          - getting_started/convert_numeric_to_integer.qmd
      - section: "R Programming Basics"  
        contents:
          - r_intro/r_code.qmd

format:
  html: 
    grid:
      sidebar-width: 300px
      body-width: 900px
      margin-width: 300px
      gutter-width: 1.5rem
    backgroundcolor: "#F5F5F5"



